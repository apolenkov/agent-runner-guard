pre-commit:
  parallel: true
  jobs:
    - name: format
      glob: "*.{ts,json,md,yml,yaml}"
      run: npx prettier --check {staged_files}
    - name: lint
      glob: "*.ts"
      run: npm run -s lint
    - name: typecheck
      glob: "*.ts"
      run: npm run -s typecheck
commit-msg:
  jobs:
    - name: commitlint
      run: npx commitlint --edit {1}
pre-push:
  jobs:
    - name: check
      run: unset GIT_DIR GIT_INDEX_FILE && npm run -s check
